name: Research and draft

# Runs on a schedule, finds trending stories per niche, drafts an article for
# each, and opens a pull request so Pablo reviews and merges by hand -- that
# merge IS the human approval step. Nothing in this repo auto-publishes.

on:
  schedule:
    # Sunday, Monday and Thursday at 13:00 UTC: 9am US Eastern in summer time, 8am in winter.
    # (0 = Sunday, 1 = Monday, 4 = Thursday.)
    - cron: "0 13 * * 0,1,4"
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab too

permissions:
  contents: write
  pull-requests: write

jobs:
  research-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research agent
        run: python3 agents/research_agent.py

      - name: Run writer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 agents/writer_agent.py

      # Off until switched on: set the repo variable FACT_CHECK_ENABLED to "true"
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Fact-check each draft (two independent checks with web search)
        if: vars.FACT_CHECK_ENABLED == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 agents/fact_check_agent.py

      - name: Find a free photo for each draft
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # optional; Openverse is used without it
        run: python3 agents/image_agent.py

      - name: Run review check
        run: python3 agents/review_check.py --all > review_report.md || true

      # Save the list of stories already drafted straight to main (it's a log, not
      # content), so tomorrow's run skips them even while today's PR waits for review.
      - name: Remember which stories were covered
        id: covered
        run: |
          git config user.name "media-pipeline-bot"
          git config user.email "actions@github.com"
          git add content/state/covered.json
          git diff --cached --quiet && exit 0
          git commit -m "Log stories covered on $(date +%Y-%m-%d)"
          if git push origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not save the covered-stories log; tomorrow may repeat a story."
          fi

      # `with:` inputs are not run through a shell, so $(date ...) would be
      # passed literally (and break the branch name). Compute it here instead.
      - name: Get today's date
        id: today
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "New draft(s): ${{ steps.today.outputs.date }}"
          branch: drafts/${{ steps.today.outputs.date }}-${{ github.run_id }}
          title: "New draft(s) for review - ${{ steps.today.outputs.date }}"
          body-path: review_report.md
          add-paths: |
            content/drafts/**
            content/images/**

      # If the drafts never reached a PR, un-mark today's stories so a later run can
      # write them again (otherwise they'd count as "covered" without Pablo seeing them).
      - name: Undo the covered-stories log if the PR wasn't created
        if: failure() && steps.covered.outputs.sha != ''
        run: |
          git fetch -q origin main
          git checkout -q -B undo origin/main
          git revert --no-edit "${{ steps.covered.outputs.sha }}"
          git push origin HEAD:main
