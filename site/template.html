<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
{{OG_IMAGE}}
<style>
  :root {
    --ink:#111; --quiet:#666; --line:#e2e2e2; --bg:#fff; --soft:#f4f4f4; --brand:#004db3;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--sans); color:var(--ink); background:var(--bg); }
  a { color:inherit; text-decoration:none; }
  img { display:block; max-width:100%; }

  /* Masthead + section bar */
  .masthead { max-width:1180px; margin:0 auto; padding:18px 16px 10px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .brand { font-family:var(--serif); font-weight:700; font-size:clamp(1.8rem, 5vw, 2.8rem); letter-spacing:-0.5px; color:var(--brand); line-height:1; }
  .today { color:var(--quiet); font-size:0.8rem; white-space:nowrap; }
  .sections { border-top:3px solid var(--brand); border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  .sections nav { max-width:1180px; margin:0 auto; display:flex; overflow-x:auto; scrollbar-width:none; }
  .sections nav::-webkit-scrollbar { display:none; }
  .sections a { flex:0 0 auto; padding:11px 14px; font-weight:700; font-size:0.85rem; border-bottom:4px solid transparent; color:#333; }
  .sections a:hover, .sections a.active { border-bottom-color:var(--c); color:var(--c); }

  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }

  /* Cards */
  .label { display:inline-block; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px; }
  .photo { position:relative; aspect-ratio:16/10; overflow:hidden; background:var(--soft); }
  .photo img { width:100%; height:100%; object-fit:cover; }
  .photo.placeholder { display:flex; align-items:center; justify-content:center; }
  .photo.placeholder span { color:#fff; font-weight:700; font-size:0.9rem; opacity:0.85; text-transform:uppercase; letter-spacing:1px; padding:8px; text-align:center; }
  .card h3 { margin:2px 0 6px; font-size:1rem; line-height:1.25; font-weight:700; }
  .card h3 a:hover { text-decoration:underline; }
  .card .card-text { padding-top:8px; }
  .summary { margin:0 0 6px; color:#333; font-size:0.92rem; line-height:1.45; }
  .date { margin:0; color:var(--quiet); font-size:0.75rem; }
  .card-lead h3 { font-size:clamp(1.5rem, 3.6vw, 2.3rem); line-height:1.12; letter-spacing:-0.3px; }
  .card-lead .summary { font-size:1.05rem; }
  .card-medium h3 { font-size:1.2rem; }

  .grid-2, .grid-3, .grid-4 { display:grid; gap:20px; }
  .grid-2 { grid-template-columns:repeat(2, 1fr); margin-top:20px; }
  .grid-3 { grid-template-columns:repeat(3, 1fr); margin-top:24px; }
  .grid-4 { grid-template-columns:repeat(4, 1fr); }

  /* Homepage */
  .home-top, .article-wrap { display:grid; grid-template-columns:minmax(0, 1fr) 300px; gap:28px; }
  .latest { border-top:3px solid var(--ink); padding-top:6px; align-self:start; }
  .latest h2 { font-size:1rem; text-transform:uppercase; letter-spacing:0.5px; margin:4px 0 8px; }
  .latest ol { list-style:none; margin:0; padding:0; }
  .latest li { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.9rem; font-weight:700; line-height:1.3; }
  .latest li a:hover { text-decoration:underline; }
  .dot { flex:0 0 8px; height:8px; border-radius:50%; margin-top:6px; }
  .block { margin-top:36px; }
  .block h2 { margin:0 0 14px; padding:7px 12px; font-size:1rem; text-transform:uppercase; letter-spacing:0.5px; }
  .block h2 a { color:#fff; }

  /* Section page */
  .section-title { font-size:2rem; margin:0 0 20px; padding-bottom:8px; border-bottom:4px solid; }
  .empty { color:var(--quiet); }

  /* Article */
  .article-main h1 { font-size:clamp(1.7rem, 4.2vw, 2.6rem); line-height:1.12; letter-spacing:-0.4px; margin:4px 0 12px; }
  .standfirst { font-size:1.15rem; line-height:1.45; color:#333; margin:0 0 12px; font-weight:700; }
  .byline { color:var(--quiet); font-size:0.85rem; margin:0 0 12px; }
  .share { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .share a, .share button { font:700 0.78rem var(--sans); padding:7px 12px; border-radius:3px; border:0; cursor:pointer; color:#fff; background:#333; }
  .share [data-share="facebook"] { background:#1877f2; }
  .share [data-share="x"] { background:#000; }
  .share [data-share="email"] { background:#5f6368; }
  .hero { margin:0 0 22px; }
  .hero figcaption { font-size:0.75rem; color:var(--quiet); padding-top:6px; }
  .hero figcaption a { text-decoration:underline; }
  .body { font-family:var(--serif); font-size:1.12rem; line-height:1.7; overflow-wrap:anywhere; }
  .body h2 { font-family:var(--sans); font-size:1.3rem; line-height:1.25; margin:1.8em 0 0.4em; }
  .body a { color:var(--brand); text-decoration:underline; }
  .body em { color:#444; }
  .takes { margin-top:40px; border-top:4px solid var(--ink); padding-top:10px; }
  .takes h2 { font-size:1.15rem; text-transform:uppercase; letter-spacing:0.5px; margin:4px 0 4px; }
  .takes-note { color:var(--quiet); font-size:0.8rem; margin:0 0 16px; }
  .take { border-left:5px solid var(--c); background:var(--soft); padding:14px 16px; margin-bottom:16px; }
  .take-head { display:flex; gap:12px; align-items:center; margin-bottom:6px; }
  .avatar { flex:0 0 40px; height:40px; border-radius:50%; background:var(--c); color:#fff; font:700 1.1rem var(--serif); display:flex; align-items:center; justify-content:center; }
  .take-head strong { font-size:1rem; color:var(--c); }
  .badge { display:inline-block; font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; border:1px solid var(--quiet); color:var(--quiet); border-radius:3px; padding:1px 5px; vertical-align:2px; }
  .tagline { margin:2px 0 0; font-size:0.8rem; color:var(--quiet); }
  .take-text p { font-family:var(--serif); font-size:1.02rem; line-height:1.6; margin:0.5em 0 0; }
  .more { margin-top:44px; }
  .more h2 { font-size:1.05rem; text-transform:uppercase; border-top:4px solid; padding-top:8px; margin:0 0 14px; }

  footer { border-top:3px solid var(--brand); background:var(--soft); text-align:center; padding:24px 16px; font-size:0.8rem; color:var(--quiet); }

  @media (max-width: 900px) {
    .home-top, .article-wrap { grid-template-columns:minmax(0, 1fr); }
    .grid-4 { grid-template-columns:repeat(2, 1fr); }
    .grid-3 { grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns:1fr; }
    .today { display:none; }
    .card-small { display:grid; grid-template-columns:120px 1fr; gap:12px; }
    .card-small .card-text { padding-top:0; }
  }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <a class="brand" href="/">{{SITE_NAME}}</a>
    <span class="today" id="today"></span>
  </div>
  <div class="sections"><nav>{{NAV}}</nav></div>
</header>
<main>
{{CONTENT}}
</main>
<footer>&copy; {{YEAR}} {{SITE_NAME}}. Articles are for general information only and are not medical, financial, or professional advice.</footer>
<script>
  // Today's date in the masthead, and share links built from this page's own URL
  // (so they work on whatever domain the site ends up on).
  document.getElementById("today").textContent = new Date().toLocaleDateString("en-US",
    { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const here = encodeURIComponent(location.href), title = encodeURIComponent(document.title);
  const links = {
    facebook: "https://www.facebook.com/sharer/sharer.php?u=" + here,
    x: "https://twitter.com/intent/tweet?url=" + here + "&text=" + title,
    email: "mailto:?subject=" + title + "&body=" + here,
  };
  document.querySelectorAll("[data-share]").forEach(el => {
    const kind = el.dataset.share;
    if (links[kind]) { el.href = links[kind]; if (kind !== "email") el.target = "_blank"; el.rel = "noopener"; }
    if (kind === "copy") el.addEventListener("click", () =>
      navigator.clipboard.writeText(location.href).then(() => { el.textContent = "Copied!"; }));
  });
</script>
</body>
</html>
